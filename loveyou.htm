<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Do You Love Me? 💗</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff0f5, #ffc2d9);
    color: #d63384;
    text-align: center;
}

.screen {
    min-height: 100vh;
    width: 100%;
    padding: 30px 15px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

#first {
    display: flex;
}

h1 {
    font-size: 32px;
    margin: 10px 0 25px;
}

.penguin {
    font-size: 110px;
    animation: bounce 1.5s infinite;
}

.heart {
    font-size: 38px;
    margin-top: -20px;
    animation: beat 1s infinite;
}

p {
    font-size: 17px;
    line-height: 1.7;
}

.buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 30px;
    padding: 14px 30px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#yes {
    background: #ff3f8e;
    color: white;
}

#no {
    background: white;
    color: #d63384;
    border: 2px solid #ff8fba;
}

#message {
    margin-top: 20px;
    font-weight: bold;
    min-height: 25px;
}

#second {
    background: linear-gradient(145deg, #ffe0eb, #fff6e9, #ffc9dd);
}

.love-title {
    font-size: 34px;
    line-height: 1.5;
}

.love-text {
    max-width: 350px;
    margin-bottom: 25px;
}

.photo-frame {
    width: min(88vw, 340px);
    padding: 10px;
    background: white;
    border: 4px solid #ffb6d0;
    border-radius: 22px;
    box-shadow: 0 8px 30px #d6338450;
}

.photo-frame img {
    display: block;
    width: 100%;
    height: 380px;
    object-fit: cover;
    border-radius: 14px;
}

.caption {
    font-size: 23px;
    font-weight: bold;
    margin-top: 20px;
}

.flower {
    position: absolute;
    font-size: 28px;
    animation: float 4s infinite ease-in-out;
}

.f1 {
    top: 20px;
    left: 15px;
}

.f2 {
    top: 50px;
    right: 15px;
}

.f3 {
    bottom: 20px;
    left: 15px;
}

.f4 {
    bottom: 20px;
    right: 15px;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}
</style>
</head>

<body>

<!-- FIRST SCREEN -->

<section class="screen" id="first">

    <h1>Do you love me? 💗</h1>

    <div class="penguin">🐧</div>

    <div class="heart">💖</div>

    <p>
        Please tell me the truth! 🥺<br>
        I am waiting for your answer...
    </p>

    <div class="buttons">

        <button id="yes" onclick="showLove()">
            YES 💗
        </button>

        <button id="no" onclick="tryAgain()">
            NO 🙈
        </button>

    </div>

    <p id="message"></p>

</section>


<!-- SECOND SCREEN -->

<section class="screen" id="second">

    <span class="flower f1">🌸</span>
    <span class="flower f2">🌷</span>
    <span class="flower f3">🌹</span>
    <span class="flower f4">🌼</span>

    <h1 class="love-title">
        Awww! 💕<br>
        You won my heart!
    </h1>

    <p class="love-text">
        You make my little world more beautiful. 🥹💗<br>
        Every moment is special, and this little surprise
        is just for you! 🌷
    </p>

    <div class="photo-frame">

        <!-- YOUR PHOTO WILL APPEAR HERE -->

        <img src="couple.jpg" alt="Our beautiful photo">

    </div>

    <div class="caption">
        Me + You = Forever 💞
    </div>

    <p>
        🌸 You are my favorite person! 🌸
    </p>

</section>


<script>
function tryAgain() {
    document.getElementById("message").textContent =
        "Oops! 🥺 Try again! 💗";
}

function showLove() {
    document.getElementById("first").style.display = "none";
    document.getElementById("second").style.display = "flex";
    window.scrollTo(0, 0);
}
</script>

</body>
    </html>
