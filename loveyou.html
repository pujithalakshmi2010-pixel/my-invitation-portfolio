<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Do You Love Me? 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background: linear-gradient(135deg, #ffe1ed, #fff0f5, #ffd6e7);
    color: #9e315e;
}

.screen {
    min-height: 100vh;
    width: 100%;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

#screen1 {
    display: flex;
}

h1 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(28px, 7vw, 42px);
    color: #d63384;
    margin-bottom: 22px;
    animation: heartbeat 1.5s infinite;
}

.subtitle {
    font-size: 15px;
    margin-top: 15px;
    color: #a84a70;
}

/* CUTE PENGUIN */

.penguin {
    position: relative;
    width: 155px;
    height: 175px;
    margin: 12px auto 24px;
    animation: float 2s ease-in-out infinite;
}

.penguin-body {
    width: 125px;
    height: 150px;
    background: #292b43;
    border-radius: 48% 48% 43% 43%;
    position: absolute;
    left: 15px;
    bottom: 0;
    box-shadow: 0 12px 22px #c77d9c55;
}

.penguin-face {
    width: 90px;
    height: 90px;
    background: #fff9f4;
    border-radius: 50%;
    position: absolute;
    top: 24px;
    left: 17px;
}

.eye {
    position: absolute;
    top: 32px;
    width: 9px;
    height: 12px;
    background: #25253a;
    border-radius: 50%;
}

.eye.left {
    left: 24px;
}

.eye.right {
    right: 24px;
}

.blush {
    position: absolute;
    top: 48px;
    width: 16px;
    height: 9px;
    background: #ffabc8;
    border-radius: 50%;
}

.blush.left {
    left: 10px;
}

.blush.right {
    right: 10px;
}

.beak {
    position: absolute;
    top: 46px;
    left: 39px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 11px solid #ffb347;
}

.wing {
    position: absolute;
    width: 34px;
    height: 72px;
    background: #292b43;
    border-radius: 50%;
    top: 57px;
}

.wing.left {
    left: 0;
    transform: rotate(25deg);
}

.wing.right {
    right: 0;
    transform: rotate(-25deg);
}

.heart {
    position: absolute;
    font-size: 38px;
    top: 95px;
    left: 57px;
    z-index: 5;
    animation: heartbeat 1s infinite;
}

.foot {
    position: absolute;
    bottom: -3px;
    width: 35px;
    height: 16px;
    background: #ffb347;
    border-radius: 50%;
}

.foot.left {
    left: 30px;
}

.foot.right {
    right: 30px;
}

/* BUTTONS */

.buttons {
    display: flex;
    gap: 18px;
    justify-content: center;
    align-items: center;
    margin-top: 12px;
    min-height: 55px;
}

button {
    border: none;
    padding: 13px 29px;
    border-radius: 30px;
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 15px #c85c8d33;
    transition: transform 0.2s;
}

button:active {
    transform: scale(0.94);
}

#yesBtn {
    color: white;
    background: linear-gradient(135deg, #ff4f96, #e72f77);
}

#noBtn {
    color: #c93d75;
    background: white;
}

#tryAgain {
    min-height: 28px;
    margin-top: 18px;
    color: #d63384;
    font-size: 14px;
    font-weight: 500;
}

/* SECOND SCREEN */

#screen2 {
    background:
        radial-gradient(circle at top left, #fff8e8, transparent 40%),
        linear-gradient(140deg, #ffe1ed, #fff3e8, #ffd3e2);
}

.love-title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(29px, 7vw, 43px);
    color: #d63384;
    line-height: 1.5;
    margin-bottom: 12px;
    animation: fadeIn 1.2s ease;
}

.love-message {
    font-size: 15px;
    line-height: 1.9;
    max-width: 340px;
    color: #97466b;
    margin: 0 auto 22px;
    animation: fadeIn 1.7s ease;
}
